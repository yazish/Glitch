<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style.css">
    <title>Glitch · Hermes</title>
</head>
<body>
    <main id="app">
        <header>
            <h1>Glitch</h1>
            <p class="location">Hermes · The Forgotten Outpost</p>
        </header>
        <div id="game-container" tabindex="-1" aria-label="Hermes game room"></div>
        <p id="objective" role="status">Find the star map on the transit platform.</p>
        <p class="controls"><kbd>WASD</kbd> / <kbd>Arrows</kbd> Move <kbd>Space</kbd> Bridge <kbd>R</kbd> Rewind <kbd>Esc</kbd> Restart room</p>
        <section id="star-map" aria-labelledby="map-title" hidden>
            <h2 id="map-title">Star map</h2>
            <ol id="waymarks" aria-label="Six Waymark slots">
                <li>1</li><li>2</li><li>3</li><li>4</li><li>5</li><li>6</li>
            </ol>
            <p id="route" role="status"></p>
        </section>
        <section id="microphone" aria-label="Optional voice input">
            <button id="mic-toggle" type="button">Enable microphone</button>
            <meter id="mic-level" min="0" max="1" value="0" aria-label="Microphone input level"></meter>
            <p id="mic-status" role="status">Microphone off. Space activates the bridge.</p>
        </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
